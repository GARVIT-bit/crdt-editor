# Scale-out stack: Nginx -> 2 Node servers -> MongoDB (replica set) + Redis.
# This project's OWN containers; nothing here touches other projects' Mongo/Redis.
#
#   docker compose up -d --build          http://localhost:8090/?doc=resume
#   docker compose up -d mongo redis      just the databases, for tests on the host
#   docker compose kill server1           the failover demo
name: crdt-editor

services:
  mongo:
    image: mongo:8
    container_name: crdt-mongo
    # Single-node replica set: needed for transactional appends (seq order == commit order).
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first run, then reports healthy once it is PRIMARY.
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }; db.hello().isWritablePrimary || quit(1)",
        ]
      interval: 3s
      timeout: 10s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: crdt-redis
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  server1: &server
    build: .
    image: crdt-editor-server
    container_name: crdt-server1
    environment:
      SERVER_ID: server1
      PORT: "3000"
      # directConnection: the replica set member is "mongo:27017", reachable from this network.
      MONGO_URL: mongodb://mongo:27017/?directConnection=true
      MONGO_DB: crdt_editor
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  server2:
    <<: *server
    container_name: crdt-server2
    environment:
      SERVER_ID: server2
      PORT: "3000"
      MONGO_URL: mongodb://mongo:27017/?directConnection=true
      MONGO_DB: crdt_editor
      REDIS_URL: redis://redis:6379

  nginx:
    image: nginx:1.27-alpine
    container_name: crdt-nginx
    ports:
      # Host port: 8080 is used by another project on this machine. Override with CRDT_HTTP_PORT.
      - "127.0.0.1:${CRDT_HTTP_PORT:-8090}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2

volumes:
  mongo-data:
