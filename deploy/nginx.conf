# Load balancer in front of the Node servers.
events {}

http {
  upstream crdt_servers {
    # Round robin. No sticky sessions needed: any server can serve any document,
    # because ops fan out through Redis and every server reads the same op log.
    server server1:3000 max_fails=1 fail_timeout=5s;
    server server2:3000 max_fails=1 fail_timeout=5s;
  }

  # "Connection: upgrade" only when the client asked for a WebSocket.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    location /ws {
      proxy_pass http://crdt_servers;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Keep idle sockets open (the server pings every 30 s).
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      # A killed container's IP silently drops packets instead of refusing them, so
      # the default 60 s connect timeout would stall every reconnect for a minute.
      # Inside the Docker network a healthy server answers in milliseconds.
      proxy_connect_timeout 2s;
      # A dead server fails the handshake: try the other one.
      proxy_next_upstream error timeout http_502 http_503;
    }

    location / {
      proxy_pass http://crdt_servers;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_connect_timeout 2s;
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
